services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: production-agent-server
    ports:
      - "8000:8000"
    env_file:
      - deploy/.env
    environment:
      - NODE_ENV=production
      - PORT=8000
      - NODE_OPTIONS=--max-old-space-size=4096
      # Docker Desktop: 经宿主机 portproxy 转发到 172.18.28.88:1433
      - SQL_HOST=host.docker.internal
    volumes:
      # Session JSONL 持久化（~/.pi/agent/sessions/）
      - agent-sessions:/root/.pi
      # Trace 日志持久化
      - agent-traces:/app/data/logs/traces
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - DATABASE_URL=postgresql://kingfa_ai:KingfaAI%402024@host.docker.internal:15432/agent
    container_name: production-agent-web
    ports:
      - "80:3000"
    env_file:
      - deploy/.env
    environment:
      - NODE_ENV=production
      - AI_API_URL=http://agent:8000
      # Docker Desktop: 经宿主机 portproxy 转发到内网 DB
      - SQL_HOST=host.docker.internal
      - DATABASE_URL=postgresql://kingfa_ai:KingfaAI%402024@host.docker.internal:15432/agent
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  agent-sessions:
  agent-traces:
